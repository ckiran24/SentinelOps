apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: sentinelops-migrate
spec:
  template:
    spec:
      taskCount: 1
      template:
        metadata:
          annotations:
            run.googleapis.com/cloudsql-instances: ${CLOUD_SQL_CONNECTION_NAME}
        spec:
          serviceAccountName: ${MIGRATION_SERVICE_ACCOUNT}
          maxRetries: 0
          timeoutSeconds: "600"
          containers:
            - image: ${API_IMAGE}
              command: [sh, -c]
              args: ["python -m sentinelops.migrate && python -m sentinelops.seed"]
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
              env:
                - name: DEMO_MODE
                  value: "false"
                - name: ENABLE_PGVECTOR
                  value: "false"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: sentinelops-migration-database-url
                      key: ${MIGRATION_DATABASE_SECRET_VERSION}
