# Template only. DB polling requires always-allocated CPU and one minimum instance.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sentinelops-worker
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/cloudsql-instances: ${CLOUD_SQL_CONNECTION_NAME}
    spec:
      serviceAccountName: ${WORKER_SERVICE_ACCOUNT}
      containerConcurrency: 1
      containers:
        - image: ${API_IMAGE}
          command: [python, /app/infra/worker_service.py]
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: DEMO_MODE
              value: "false"
            - name: LIVE_TOOLS_ENABLED
              value: "false"
            - name: ENABLE_PGVECTOR
              value: "false"
            - name: LLM_MODE
              value: fixture
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentinelops-database-url
                  key: ${DATABASE_SECRET_VERSION}
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
