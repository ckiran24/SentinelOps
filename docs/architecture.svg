<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="910" viewBox="0 0 1360 910" role="img" aria-labelledby="title desc">
<title id="title">SentinelOps architecture</title><desc id="desc">The web console talks to the API, which persists incident and approval records in PostgreSQL. A separate LangGraph worker claims database jobs and uses a deterministic policy gate, simulated adapters, curated runbooks and optional OpenAI reasoning. High-risk execution requires human approval. Real integrations remain a deployment extension.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a96ad"/></marker><style>text{font-family:Arial,sans-serif;fill:#e7eef6}.label{font-size:20px;font-weight:700}.sub{font-size:16px;fill:#acc0d3}.note{font-size:16px;fill:#c5d5e4}.line{fill:none;stroke:#7a96ad;stroke-width:2;marker-end:url(#head)}.optional{stroke-dasharray:7 6}.box{fill:#132335;stroke:#34506b;stroke-width:1.5;rx:12}.safety{fill:#302719;stroke:#dcad50;stroke-width:2;rx:12}</style></defs>
<rect width="1360" height="910" fill="#08131f"/>
<text x="60" y="62" font-size="34" font-weight="700">SentinelOps</text><text x="60" y="96" class="sub">Evidence-led investigation with an explicit human approval boundary</text>
<rect x="60" y="142" width="315" height="117" class="box"/><text x="85" y="178" class="label">Operator console</text><text x="85" y="207" class="sub">Next.js / React</text><text x="85" y="233" class="sub">Evidence · approve · execute · report</text>
<rect x="522" y="142" width="315" height="117" class="box"/><text x="547" y="178" class="label">Trusted API boundary</text><text x="547" y="207" class="sub">FastAPI · Pydantic · JWT / RBAC</text><text x="547" y="233" class="sub">Validate requests · persist jobs</text>
<path d="M375 200H515" class="line"/><text x="396" y="183" class="sub">HTTP + token</text>
<rect x="522" y="351" width="315" height="141" class="box"/><text x="547" y="388" class="label">Durable source of truth</text><text x="547" y="418" class="sub">PostgreSQL · optional pgvector</text><text x="547" y="445" class="sub">Incidents · jobs · exact proposals</text><text x="547" y="471" class="sub">Approvals · audit · runbooks</text>
<path d="M680 259V344" class="line"/><text x="699" y="310" class="sub">Transactions</text>
<rect x="60" y="351" width="315" height="141" class="box"/><text x="85" y="388" class="label">Separate worker process</text><text x="85" y="418" class="sub">Python · LangGraph</text><text x="85" y="445" class="sub">Claim jobs · investigate · verify</text><text x="85" y="471" class="sub">Bounded retry / recovery</text>
<path d="M375 424H515" class="line"/><text x="394" y="404" class="sub">Jobs + results</text>
<rect x="966" y="142" width="334" height="117" class="box"/><text x="991" y="178" class="label">Optional reasoning</text><text x="991" y="207" class="sub">OpenAI Responses API</text><text x="991" y="233" class="sub">Structured hypothesis from evidence</text>
<path d="M217 351V293H1128V266" class="line optional"/>
<rect x="60" y="589" width="315" height="136" class="safety"/><text x="85" y="625" class="label">Deterministic policy gate</text><text x="85" y="655" class="sub">Typed arguments · tool allowlist</text><text x="85" y="681" class="sub">Approval + proposal fingerprint</text><text x="85" y="707" class="sub">Role check + idempotency</text>
<path d="M217 492V582" class="line"/><text x="237" y="544" class="sub">Recheck at execution</text>
<rect x="522" y="589" width="315" height="136" class="box"/><text x="547" y="625" class="label">Fixture tool adapter</text><text x="547" y="655" class="sub">Metrics · deployments · logs</text><text x="547" y="681" class="sub">Named read-only diagnostics</text><text x="547" y="707" class="sub">Approved simulated rollback/restart</text>
<path d="M375 657H515" class="line"/><text x="397" y="638" class="sub">Validated call</text>
<rect x="966" y="351" width="334" height="141" class="box"/><text x="991" y="388" class="label">Read-only MCP server</text><text x="991" y="418" class="sub">Standard typed tool interface</text><text x="991" y="445" class="sub">Fixture observations only</text><text x="991" y="471" class="sub">No direct mutation bypass</text>
<path d="M1133 492V554H680V582" class="line"/>
<rect x="966" y="589" width="334" height="136" class="box"/><text x="991" y="625" class="label">Real integration extension</text><text x="991" y="655" class="sub">Scoped credentials + staging tests</text><text x="991" y="681" class="sub">Provider idempotency / reconciliation</text><text x="991" y="707" class="sub">Fail closed until implemented</text>
<path d="M837 657H959" class="line optional"/>
<path d="M837 201H904V795H217V732" class="line"/><text x="549" y="789" class="sub">Human approval persisted by API; approval and execution are separate operations</text>
<text x="60" y="849" class="note">Solid: implemented core flow. Dashed: optional configuration or extension boundary.</text><text x="60" y="877" class="note">Compose runs containers locally. Cloud deployment adds HTTPS ingress, managed database, secrets and an always-on worker.</text>
</svg>
